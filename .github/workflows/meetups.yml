name: 당근 모임 일정 업데이트

on:
  schedule:
    - cron: "0 0 */2 * *" # 2일마다 오전 9시(한국 시간)
  workflow_dispatch: {} # Actions 탭에서 "Run workflow" 로 바로 업데이트

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-meetups.mjs
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add meetups.json
          git diff --cached --quiet || (git commit -m "모임 일정 자동 업데이트" && git push)
