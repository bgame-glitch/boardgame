<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>당근 링크 테스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>
/* Layout: single phone column — test buttons on top, real meetup cards below */
:root{
  --bg:#f6f3ee; --card:#ffffff; --fg:#2a2420; --muted:#7a6f66; --line:#e6ded4;
  --accent:#ff6f0f; --accent-ink:#ffffff; --ok:#1f9d55; --full:#9a8f86; --member:#5b5bd6;
  --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1714; --card:#26201c; --fg:#f1ebe5; --muted:#a89b90; --line:#3a312b;
  --accent:#ff8a3d; --accent-ink:#1b1714; --ok:#4cc982; --full:#8a7f76; --member:#9b9bff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1714; --card:#26201c; --fg:#f1ebe5; --muted:#a89b90; --line:#3a312b;
  --accent:#ff8a3d; --accent-ink:#1b1714; --ok:#4cc982; --full:#8a7f76; --member:#9b9bff; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
main{max-width:520px;margin:0 auto;display:grid;gap:22px}
h1{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600}
p{margin:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.tests{display:grid;gap:10px}
.test{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.test b{font-size:15px}
.test small{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;
  font:600 15px var(--body);text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cards{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:88px 1fr}
.thumb{background:var(--line) center/cover no-repeat;min-height:100%}
.info{padding:12px 14px;display:grid;gap:6px;min-width:0}
.when{font-size:13px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.name{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.chip.open{color:var(--ok)} .chip.full{color:var(--full)} .chip.member{color:var(--member)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.card .row .btn{min-height:38px;font-size:14px;padding:0 12px}
.note{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px}
</style>
</head>
<body>

<main>
  <header>
    <h1>당근 링크 테스트</h1>
    <p class="sub">테크노폴리스 보드게임 · 버튼을 눌러 당근 앱이 열리는지 확인해 주세요</p>
  </header>

  <section>
    <h2>테스트 1~3</h2>
    <div class="tests" id="tests"></div>
  </section>

  <p class="note">지금 기기: <b id="env">확인 중</b><br>각 테스트마다 A·B·C 버튼을 눌러보고, 당근 앱의 해당 화면이 열린 버튼을 알려주세요. 카카오톡에서 이 링크를 열어서 테스트하면 가장 정확해요.</p>

  <section>
    <h2>저장된 일정 5개 · 11월 18일 기준</h2>
    <div class="cards" id="cards"></div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
const GROUP = "412730";
const deep = path => "karrot://minikarrot/router?navbar=false&scrollable=false&remote=" +
  encodeURIComponent("https://community-web-group.kr.karrotmarket.com" + path);

// 당근 공식 웹페이지와 같은 방식: 안드로이드는 intent://, 그 외(아이폰)는 당근 onelink
const oneLink = scheme => { const p = new URLSearchParams();
  p.set("af_dp", scheme); p.set("deep_link_value", scheme); p.set("af_force_deeplink","true");
  p.set("is_retargeting","true"); p.set("af_reengagement_window","30d"); p.set("pid","web_kr");
  return "https://daangn.onelink.me/oWdR?" + p.toString(); };
const intentUrl = scheme => { const i = scheme.indexOf("://");
  return "intent://" + scheme.slice(i+3) + "#Intent;scheme=karrot;package=com.towneers.www;S.browser_fallback_url=" + encodeURIComponent(oneLink(scheme)) + ";end"; };
const isAndroid = /Android/i.test(navigator.userAgent);
const auto = scheme => isAndroid ? intentUrl(scheme) : oneLink(scheme);

const tests = [
  { t:"1. 일정 하나 바로 열기", d:"프로스트헤이븐 정리 및 마무리파티 화면이 열리면 성공", url: deep(`/group/${GROUP}/meetups/306708103`) },
  { t:"2. 모임 전체 일정 목록 열기", d:"당근 앱의 '모임 일정' 전체 목록이 열리면 성공", url: deep(`/group/${GROUP}/meetups`) },
  { t:"3. 모임 홈 열기", d:"테크노폴리스 보드게임 모임 첫 화면이 열리면 성공", url: deep(`/group/${GROUP}`) },
];
const variants = [
  { k:"A", label:"A 자동", f:auto },
  { k:"B", label:"B 앱 주소", f:s=>s },
  { k:"C", label:"C 연결 링크", f:oneLink },
];

const meetups = [
  {id:"306612885",name:"초보도 가능한 초중급 오를레앙, 라",img:"https://img.kr.gcp-karroter.net/community/community/20261112/2f454809-cc49-4f81-a973-c33b1273c3ea.png?service=community",member:true,status:"OPENED",cur:3,max:4,at:"2026-11-19T11:00:00Z",place:"쏭지트"},
  {id:"306684423",name:"파티파티?전략전략?🔥불토불태우기🔥",img:null,member:false,status:"OPENED",cur:3,max:8,at:"2026-11-21T06:00:00Z",place:"아지트"},
  {id:"306547470",name:"시계탑에 흐른피ㅡ 마피아",img:"https://img.kr.gcp-karroter.net/community/community/20261108/81209b07-78a1-400d-a914-160e88ddea4c.jpeg?service=community",member:false,status:"OPENED",cur:7,max:17,at:"2026-11-22T05:00:00Z",place:"엘리시아"},
  {id:"306619647",name:"이 세계에 오신 것을 환영합니다[0179 후속]",img:"https://img.kr.gcp-karroter.net/community/community/20261112/bc05918e-4e1c-4136-9540-c70fa89e3a3e.png?service=community",member:true,status:"FULLY_RECRUITED",cur:4,max:4,at:"2026-11-24T10:30:00Z",place:"아지트"},
  {id:"306708103",name:"프로스트헤이븐 정리 및 마무리파티",img:"https://img.kr.gcp-karroter.net/community/community/20261118/87c5c1c3-3598-45cc-bf6b-205903d9a1ca.jpeg?service=community",member:true,status:"OPENED",cur:3,max:4,at:"2026-11-26T11:00:00Z",place:"엘리시아"},
];

const toast = msg => { const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,1800); };
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast("링크를 복사했어요"); }
  catch(e){ toast("복사가 막혔어요"); }
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("tests").innerHTML = tests.map((x,i)=>`
  <div class="test">
    <b>${x.t}</b><small>${x.d}</small>
    <div class="row">
      ${variants.map((v,j)=>`<a class="btn ${j?"ghost":"primary"}" href="${esc(v.f(x.url))}">${v.label}</a>`).join("")}
    </div>
  </div>`).join("");
document.getElementById("env").textContent = (isAndroid ? "안드로이드" : /iPhone|iPad/i.test(navigator.userAgent) ? "아이폰" : "PC/기타") +
  (/KAKAOTALK/i.test(navigator.userAgent) ? " · 카카오톡 브라우저" : "");

const fmt = iso => { const d=new Date(iso);
  return d.toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",weekday:"short",hour:"numeric",minute:"2-digit"}); };
document.getElementById("cards").innerHTML = meetups.map(m=>{
  const full = m.status!=="OPENED";
  return `<article class="card">
    <div class="thumb" style="${m.img?`background-image:url('${m.img}')`:""}"></div>
    <div class="info">
      <span class="when">${fmt(m.at)}</span>
      <span class="name">${esc(m.name)}</span>
      <span class="meta">📍 ${esc(m.place)} · ${m.cur}/${m.max}명</span>
      <div class="bar"><i style="width:${Math.round(m.cur/m.max*100)}%"></i></div>
      <div class="chips">
        <span class="chip ${full?"full":"open"}">${full?"마감":"모집중"}</span>
        ${m.member?'<span class="chip member">멤버 전용</span>':""}
      </div>
      <div class="row"><a class="btn primary" href="${esc(auto(deep(`/group/${GROUP}/meetups/${m.id}`)))}">당근에서 참석하기</a></div>
    </div>
  </article>`;}).join("");
</script>
</body>
</html>
