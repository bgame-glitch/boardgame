<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f5d50">
<title>현풍 테크노폴리스 보드게임</title>
<meta name="apple-mobile-web-app-title" content="현풍보드게임">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #222;
    --muted: #777;
    --line: #e3dfd6;
    --accent: #2f5d50;
    --accent-text: #fff;
    --loc: #b5532f;
    --shade: rgba(0, 0, 0, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1d1c;
      --card: #262928;
      --text: #eee;
      --muted: #9a9a9a;
      --line: #3a3d3c;
      --accent: #6fb39d;
      --accent-text: #10201b;
      --loc: #f0a07d;
      --shade: rgba(0, 0, 0, .65);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 14px 16px 8px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
  .brand img { width: 52px; height: 52px; flex: 0 0 52px; }
  .brand h1 { flex: 1; margin: 0; font-family: "Jua", sans-serif; font-weight: 400; line-height: 1.1; }
  .brand .sub { display: block; font-size: 14px; color: var(--accent); letter-spacing: .5px; }
  .brand .main { display: block; font-size: 26px; color: var(--text); }
  .brand .main span { color: #f2b705; -webkit-text-stroke: .6px #7a4a1c; }
  #reset {
    font-size: 13px; background: none; border: 1px solid var(--line);
    color: var(--muted); border-radius: 999px; padding: 4px 10px; cursor: pointer;
  }
  #search {
    width: 100%; font-size: 16px; padding: 9px 12px; margin-bottom: 10px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text);
  }
  .group { margin-bottom: 8px; }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 7px 13px; font-size: 14px; cursor: pointer;
  }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  main { padding: 12px 16px 40px; }
  #count { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .game {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
  }
  .thumb {
    flex: 0 0 64px; width: 64px; height: 64px; border-radius: 8px;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    font-size: 28px; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .info { flex: 1; min-width: 0; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .name { font-size: 16px; font-weight: 700; }
  .rating { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .meta { font-size: 13px; color: var(--muted); }
  .loc { margin-top: 6px; font-size: 15px; font-weight: 600; color: var(--loc); }
  .empty, .msg { text-align: center; color: var(--muted); padding: 40px 0; }

  /* 상세 보기 */
  #sheet-bg {
    position: fixed; inset: 0; z-index: 20; background: var(--shade);
    display: none; align-items: flex-end; justify-content: center;
  }
  #sheet-bg.open { display: flex; }
  #sheet {
    width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    background: var(--card); border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
  }
  #sheet .close {
    float: right; border: none; background: none; color: var(--muted);
    font-size: 24px; line-height: 1; cursor: pointer; padding: 0 4px;
  }
  #sheet .big {
    width: 140px; height: 140px; margin: 4px auto 12px; border-radius: 10px;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    font-size: 56px; overflow: hidden;
  }
  #sheet .big img { width: 100%; height: 100%; object-fit: contain; }
  #sheet h2 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  #sheet .rating { text-align: center; margin-bottom: 12px; }
  #sheet dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; font-size: 15px; }
  #sheet dt { color: var(--muted); }
  #sheet dd { margin: 0; }
  #sheet .loc { font-size: 17px; text-align: center; margin: 0 0 16px; }
  .shelf { margin: -6px auto 16px; width: fit-content; }
  .shelf-title { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .shelf-grid {
    display: grid; gap: 3px;
    padding: 6px; border-radius: 8px;
    background: #8a5a2b; /* 나무 책장 느낌 */
  }
  .shelf-grid .h { font-size: 11px; color: #f5e6cf; text-align: center; line-height: 16px; }
  .shelf-grid .cell {
    width: 30px; height: 24px; border-radius: 3px; background: #f3e7d3;
  }
  .shelf-grid .cell.here {
    background: var(--loc); box-shadow: 0 0 0 2px #fff inset;
    animation: blink 1s ease-in-out 3;
  }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .shelf-grid .cell.here { animation: none; } }
  .btn {
    display: block; text-align: center; text-decoration: none;
    padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; margin-bottom: 8px;
    border: 1px solid var(--line); color: var(--text); background: var(--bg);
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="img/logo.png" alt="">
    <h1><span class="sub">현풍 테크노폴리스</span><span class="main"><span>보드게임</span> 찾기</span></h1>
    <button id="reset">초기화</button>
  </div>
  <input id="search" type="search" placeholder="게임 이름 검색" autocomplete="off">
  <div class="group"><div class="label">장르</div><div class="chips" id="f-genre"></div></div>
  <div class="group"><div class="label">세부장르</div><div class="chips" id="f-sub"></div></div>
  <div class="group"><div class="label">인원</div><div class="chips" id="f-players"></div></div>
  <div class="group"><div class="label">난이도</div><div class="chips" id="f-diff"></div></div>
  <div class="group"><div class="label">플레이 시간</div><div class="chips" id="f-time"></div></div>
  <div class="group"><div class="label">정렬</div><div class="chips" id="f-sort"></div></div>
</header>
<main>
  <div id="count"></div>
  <div id="list"><div class="msg">불러오는 중…</div></div>
</main>

<div id="sheet-bg"><div id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
// ▼ 구글 시트를 "웹에 게시(CSV)" 한 주소를 여기에 붙여넣으세요. 비워두면 data.csv 파일을 읽습니다.
const SHEET_CSV_URL = "";

// ▼ 책장 크기 (가로 열 수 × 세로 단 수). 위치는 "거실 C2"처럼 적어요: 방 이름 + 열(알파벳) + 단(위에서부터 1).
// ※ 임시로 모두 7×4. 실제 책장 사진을 보고 고칠 예정.
const SHELVES = {
  "거실":   { cols: 7, rows: 4 },
  "안방":   { cols: 7, rows: 4 },
  "작은방": { cols: 7, rows: 4 },
};

const PLAYER_OPTIONS = [2, 3, 4, 5, 6]; // 6 = 6명 이상
const DIFF_LABEL = { 1: "★ 쉬움", 2: "★★ 보통", 3: "★★★ 어려움" };
const TIME_OPTIONS = [
  { key: "t30",  label: "30분 이하", test: t => t <= 30 },
  { key: "t60",  label: "1시간 이하", test: t => t > 30 && t <= 60 },
  { key: "t120", label: "1~2시간",   test: t => t > 60 && t <= 120 },
  { key: "t121", label: "2시간 이상", test: t => t > 120 },
];

let games = [];
let query = "";
const sel = { genre: new Set(), sub: new Set(), players: null, diff: new Set(), time: new Set() };

const byName = (a, b) => a.name.localeCompare(b.name, "ko");
const SORTS = {
  name:     { label: "이름순",     fn: byName },
  rating:   { label: "평점 높은순", fn: (a, b) => (b.rating ?? -1) - (a.rating ?? -1) || byName(a, b) },
  diffAsc:  { label: "쉬운 순",     fn: (a, b) => (a.diff || 99) - (b.diff || 99) || byName(a, b) },
  diffDesc: { label: "어려운 순",   fn: (a, b) => (b.diff || 0) - (a.diff || 0) || byName(a, b) },
};
let sortKey = "name";

// 따옴표·쉼표를 처리하는 간단한 CSV 파서
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}

// 시트 열 순서: 이름, 장르, 세부장르, 최소인원, 최대인원, 난이도, 위치, 평점, 이미지, 시간(분), 보드라이프번호
function toGames(rows) {
  return rows.slice(1).map(r => ({
    name: (r[0] || "").trim(),
    genre: (r[1] || "").trim(),
    sub: (r[2] || "").trim(),
    min: parseInt(r[3], 10) || 1,
    max: parseInt(r[4], 10) || parseInt(r[3], 10) || 99,
    diff: parseInt(r[5], 10) || 0,
    loc: (r[6] || "").trim(),
    rating: parseFloat(r[7]) || null,
    img: (r[8] || "").trim(),
    time: parseInt(r[9], 10) || null,
    blId: (r[10] || "").trim(),
  })).filter(g => g.name);
}

const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
const norm = s => s.toLowerCase().replace(/\s+/g, "");
const playersText = x => x.min === x.max ? `${x.min}인` : `${x.min}~${x.max}인`;
const timeText = t => !t ? "" : t >= 60 && t % 60 === 0 ? `${t / 60}시간` : t > 60 ? `${Math.floor(t / 60)}시간 ${t % 60}분` : `${t}분`;

function chip(label, on, onClick) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : "");
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); }

function renderFilters() {
  const g = document.getElementById("f-genre"); g.innerHTML = "";
  uniq(games.map(x => x.genre)).forEach(v =>
    g.appendChild(chip(v, sel.genre.has(v), () => {
      toggle(sel.genre, v);
      // 선택 해제된 장르의 세부장르는 같이 해제
      const valid = new Set(subOptions());
      [...sel.sub].forEach(s => { if (!valid.has(s)) sel.sub.delete(s); });
      update();
    })));

  const s = document.getElementById("f-sub"); s.innerHTML = "";
  subOptions().forEach(v =>
    s.appendChild(chip(v, sel.sub.has(v), () => { toggle(sel.sub, v); update(); })));

  const p = document.getElementById("f-players"); p.innerHTML = "";
  PLAYER_OPTIONS.forEach(n =>
    p.appendChild(chip(n === 6 ? "6명+" : n + "명", sel.players === n, () => {
      sel.players = sel.players === n ? null : n; update();
    })));

  const d = document.getElementById("f-diff"); d.innerHTML = "";
  [1, 2, 3].forEach(n =>
    d.appendChild(chip(DIFF_LABEL[n], sel.diff.has(n), () => { toggle(sel.diff, n); update(); })));

  const tm = document.getElementById("f-time"); tm.innerHTML = "";
  TIME_OPTIONS.forEach(o =>
    tm.appendChild(chip(o.label, sel.time.has(o.key), () => { toggle(sel.time, o.key); update(); })));

  const so = document.getElementById("f-sort"); so.innerHTML = "";
  Object.entries(SORTS).forEach(([k, v]) =>
    so.appendChild(chip(v.label, sortKey === k, () => { sortKey = k; update(); })));
}

function subOptions() {
  const src = sel.genre.size ? games.filter(x => sel.genre.has(x.genre)) : games;
  return uniq(src.map(x => x.sub));
}

function matches(x) {
  if (query && !norm(x.name).includes(query)) return false;
  if (sel.genre.size && !sel.genre.has(x.genre)) return false;
  if (sel.sub.size && !sel.sub.has(x.sub)) return false;
  if (sel.players !== null) {
    if (sel.players === 6 ? x.max < 6 : (x.min > sel.players || x.max < sel.players)) return false;
  }
  if (sel.diff.size && !sel.diff.has(x.diff)) return false;
  if (sel.time.size) {
    if (!x.time) return false;
    if (!TIME_OPTIONS.some(o => sel.time.has(o.key) && o.test(x.time))) return false;
  }
  return true;
}

function setImage(box, url) {
  if (!url) return;
  const img = document.createElement("img");
  img.src = url; img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
  box.textContent = ""; box.appendChild(img);
  img.onerror = () => { box.textContent = "🎲"; }; // 이미지가 깨지면 기본 아이콘으로
}

function renderList() {
  const list = document.getElementById("list");
  const res = games.filter(matches).sort(SORTS[sortKey].fn);
  document.getElementById("count").textContent = `게임 ${res.length}개`;
  if (!res.length) { list.innerHTML = '<div class="empty">조건에 맞는 게임이 없어요</div>'; return; }
  list.innerHTML = "";
  res.forEach(x => {
    const el = document.createElement("div");
    el.className = "game";
    const parts = [x.genre, x.sub].filter(Boolean).join(" · ");
    const facts = [parts, playersText(x), x.time ? "⏱ " + timeText(x.time) : "", "★".repeat(x.diff)].filter(Boolean);
    el.innerHTML = `
      <div class="thumb">🎲</div>
      <div class="info">
        <div class="top"><div class="name"></div><div class="rating"></div></div>
        <div class="meta"></div>
        <div class="loc"></div>
      </div>`;
    setImage(el.querySelector(".thumb"), x.img);
    el.querySelector(".name").textContent = x.name;
    el.querySelector(".rating").textContent = x.rating ? "⭐ " + x.rating.toFixed(1) : "";
    el.querySelector(".meta").textContent = facts.join("  |  ");
    el.querySelector(".loc").textContent = "📍 " + (x.loc || "위치 미등록");
    el.onclick = () => openSheet(x);
    list.appendChild(el);
  });
}

// ---------- 책장 지도 ----------
// "거실 C2" → { room: "거실", col: 2(0부터), row: 1(0부터) }. 형식이 다르면 null.
function parseLoc(loc) {
  const m = (loc || "").trim().match(/^(.+?)\s*([A-Za-z])\s*-?\s*(\d+)\s*(단|층)?$/);
  if (!m) return null;
  const room = m[1].trim();
  const shelf = SHELVES[room];
  if (!shelf) return null;
  const col = m[2].toUpperCase().charCodeAt(0) - 65;
  const row = parseInt(m[3], 10) - 1;
  if (col < 0 || col >= shelf.cols || row < 0 || row >= shelf.rows) return null;
  return { room, col, row, shelf };
}

function shelfMap(loc) {
  const p = parseLoc(loc);
  if (!p) return null;
  const wrap = document.createElement("div");
  wrap.className = "shelf";
  const title = document.createElement("div");
  title.className = "shelf-title";
  title.textContent = `${p.room} 책장`;
  const grid = document.createElement("div");
  grid.className = "shelf-grid";
  grid.style.gridTemplateColumns = `16px repeat(${p.shelf.cols}, 30px)`;
  grid.appendChild(document.createElement("div")); // 왼쪽 위 빈칸
  for (let c = 0; c < p.shelf.cols; c++) {
    const h = document.createElement("div"); h.className = "h"; h.textContent = String.fromCharCode(65 + c);
    grid.appendChild(h);
  }
  for (let r = 0; r < p.shelf.rows; r++) {
    const h = document.createElement("div"); h.className = "h"; h.textContent = r + 1;
    grid.appendChild(h);
    for (let c = 0; c < p.shelf.cols; c++) {
      const cell = document.createElement("div");
      cell.className = "cell" + (r === p.row && c === p.col ? " here" : "");
      grid.appendChild(cell);
    }
  }
  wrap.append(title, grid);
  return wrap;
}

// ---------- 상세 보기 ----------
const sheetBg = document.getElementById("sheet-bg");
const sheet = document.getElementById("sheet");

function openSheet(x) {
  sheet.innerHTML = `
    <button class="close" aria-label="닫기">×</button>
    <div class="big">🎲</div>
    <h2></h2>
    <div class="rating"></div>
    <div class="loc"></div>
    <div class="shelf-slot"></div>
    <dl></dl>
    <div class="links"></div>`;
  const map = shelfMap(x.loc);
  if (map) sheet.querySelector(".shelf-slot").appendChild(map);
  setImage(sheet.querySelector(".big"), x.img);
  sheet.querySelector("h2").textContent = x.name;
  sheet.querySelector(".rating").textContent = x.rating ? "⭐ " + x.rating.toFixed(1) + " (BGG)" : "";
  sheet.querySelector(".loc").textContent = "📍 " + (x.loc || "위치 미등록");

  const rows = [
    ["장르", [x.genre, x.sub].filter(Boolean).join(" · ")],
    ["인원", playersText(x)],
    ["시간", timeText(x.time)],
    ["난이도", x.diff ? DIFF_LABEL[x.diff] : ""],
  ].filter(r => r[1]);
  const dl = sheet.querySelector("dl");
  rows.forEach(([k, v]) => {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  });

  const links = sheet.querySelector(".links");
  const yt = document.createElement("a");
  yt.className = "btn primary"; yt.target = "_blank"; yt.rel = "noopener";
  yt.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(x.name + " 보드게임 룰 설명");
  yt.textContent = "▶ 룰 설명 영상 찾기";
  links.appendChild(yt);
  if (/^\d+$/.test(x.blId)) {
    const bl = document.createElement("a");
    bl.className = "btn"; bl.target = "_blank"; bl.rel = "noopener";
    bl.href = "https://boardlife.co.kr/game/" + x.blId;
    bl.textContent = "보드라이프에서 보기";
    links.appendChild(bl);
  }

  sheet.querySelector(".close").onclick = closeSheet;
  sheetBg.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeSheet() {
  sheetBg.classList.remove("open");
  document.body.style.overflow = "";
}
sheetBg.addEventListener("click", e => { if (e.target === sheetBg) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// ---------- 시작 ----------
function update() { renderFilters(); renderList(); }

document.getElementById("search").addEventListener("input", e => {
  query = norm(e.target.value); renderList();
});

document.getElementById("reset").onclick = () => {
  sel.genre.clear(); sel.sub.clear(); sel.diff.clear(); sel.time.clear(); sel.players = null;
  sortKey = "name"; query = ""; document.getElementById("search").value = "";
  update();
};

fetch(SHEET_CSV_URL || "data.csv", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => { games = toGames(parseCSV(t)); update(); })
  .catch(() => {
    document.getElementById("list").innerHTML =
